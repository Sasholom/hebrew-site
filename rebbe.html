<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📜 Ответ Ребе — SaSholom</title>

  <meta name="description" content="Ответ по письмам Любавичского Ребе (Игрот Кодеш) и статьям chabad.org — по смыслу вопроса, с указанием источника.">
  <meta name="robots" content="index, follow">

  <!-- ===== ТЕМА И PWA ===== -->
  <meta name="theme-color" content="#060b12">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Ставим тему до отрисовки, чтобы не мигало (делится с основным приложением) -->
  <script>
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('sasholom_theme') || 'dark');
    } catch (e) {}
  </script>

  <!-- ===== ШРИФТЫ ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">

  <!-- ===== БИБЛИОТЕКИ (CDN) ===== -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="stylesheet" href="style.css?v=3">

  <!-- ===== СТИЛИ РЕЖИМА «ОТВЕТ РЕБЕ» ===== -->
  <style>
    /* Ссылка «назад на главную» в шапке */
    .back-link {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 36px;
      padding: 0 12px;
      font-size: 0.88em;
      color: var(--text-color);
      background: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: 999px;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .back-link:hover { border-color: var(--accent); }

    /* Приветственная карточка-пояснение */
    .rebbe-intro {
      max-width: 760px;
      margin: 6px auto 18px;
      padding: 18px 20px;
      background: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-size: 0.95em;
      line-height: 1.6;
    }
    .rebbe-intro strong { color: var(--text-color); }

    /* Блок источников под ответом */
    .rebbe-sources {
      margin: 8px 0 0 44px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .rebbe-sources .src-title {
      width: 100%;
      font-size: 0.8em;
      color: var(--text-muted);
      margin-bottom: 2px;
    }
    .src-card {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 7px 12px;
      font-size: 0.82em;
      color: var(--text-color);
      background: var(--surface-bg);
      border: 1px solid var(--surface-border);
      border-radius: 999px;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    a.src-card:hover { border-color: var(--accent); background: var(--surface-hover); }
    .src-card .src-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .src-card .src-emoji { flex-shrink: 0; }

    /* RTL-фикс для отступа источников на иврите */
    [dir="rtl"] .rebbe-sources { margin: 8px 44px 0 0; }
  </style>
</head>
<body>

  <!-- ============================================================
       ШАПКА
       ============================================================ -->
  <header class="topbar">
    <a href="index.html" class="back-link"><i data-lucide="arrow-left"></i> <span id="back-text">На главную</span></a>
    <h1 class="brand">📜 <span id="brand-text">Ответ Ребе</span></h1>

    <div class="topbar-right">
      <button id="theme-toggle" class="chip" title="Сменить тему">🌓</button>
    </div>
  </header>

  <!-- ============================================================
       ЧАТ
       ============================================================ -->
  <main class="chat-area">
    <div id="chat-history">
      <div class="rebbe-intro" id="rebbe-intro">
        Задай вопрос — и я поищу ответ в <strong>письмах Любавичского Ребе</strong>
        (Игрот Кодеш) и <strong>статьях chabad.org</strong>, а затем отвечу,
        опираясь на найденное, и укажу источник. Если подходящего материала
        не найдётся — честно скажу об этом.
      </div>
    </div>
  </main>

  <!-- ============================================================
       КОМПОЗЕР
       ============================================================ -->
  <div class="composer">
    <div class="composer-box">
      <textarea id="ai-question" rows="1" placeholder="Спроси совета, задай вопрос по жизни, учёбе, вере..." maxlength="2000"></textarea>
      <div class="composer-actions">
        <div class="composer-group"></div>
        <div class="composer-group">
          <button id="ai-ask-btn" class="send-btn" title="Спросить"><i data-lucide="arrow-up"></i></button>
        </div>
      </div>
    </div>
    <footer class="credit">Made with <span>💚</span> by S.K.</footer>
  </div>

  <script src="rebbe.js?v=1"></script>

  <!-- ===== SERVICE WORKER (PWA) ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
