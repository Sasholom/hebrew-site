<body>
  <button id="lang-toggle" class="theme-toggle lang-toggle" title="Сменить язык">🌐 RU</button>
  <button id="theme-toggle" class="theme-toggle" title="Сменить тему">🌓</button>

  <h1>🚀 SaSholom</h1>

  <div class="card">
    <h2>🧠 Hebrew AI</h2>
    <div class="provider-switcher">
      <button class="provider-btn active" data-provider="chadgpt">🤖 GPT</button>
      <button class="provider-btn" data-provider="gemini">🌌 Gemini</button>
    </div>
    
    <div class="presets">
      <button class="preset-btn active" data-role="default">💬 Обычный</button>
      <button class="preset-btn" data-role="translator">🌐 Переводчик</button>
      <button class="preset-btn" data-role="poet">🎭 Поэт</button>
      <button class="preset-btn" data-role="coder">💻 Кодер</button>
    </div>
    <div class="input-wrapper">
      <textarea id="ai-question" placeholder="Задай любой вопрос..." maxlength="2000"></textarea>
      <button id="voice-btn" class="voice-btn" title="Голосовой ввод">🎤</button>
      <button id="lang-btn" class="lang-btn" title="Сменить язык">🌐 RU</button>
      <input type="file" id="image-input" accept="image/*" style="display:none">
      <button id="image-btn" class="voice-btn" title="Загрузить фото">📷</button>
    </div>
<!--    
    <button id="ai-ask-btn">Спросить 💬</button> 
    <button id="clear-chat-btn">🗑️ Очистить чат</button>
    <div id="chat-history">
      <div class="message ai-message">
        <span class="avatar">🧠</span>
        <div class="bubble">Привет! Задай мне любой вопрос 😎</div>
      </div>
    </div>
  </div>
