<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaSholom AI</title>

  <!-- ===== SEO ===== -->
  <meta name="description" content="AI‑портал SaSholom: задавай вопросы, загружай фото, выбирай персонажа">
  <meta name="keywords" content="AI, чат, иврит, благословения, фото, персонажи">
  <meta name="author" content="SaSholom">
  <meta name="robots" content="index, follow">

  <!-- ===== OPEN GRAPH (соцсети) ===== -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sasholomsite.vercel.app/">
  <meta property="og:title" content="SaSholom AI — умный помощник с персонажами">
  <meta property="og:description" content="100+ AI‑персонажей, фото‑благословения, голосовой ввод и многое другое.">
  <meta property="og:image" content="https://sasholomsite.vercel.app/preview.png">
  <meta property="og:locale" content="ru_RU">

  <!-- ===== TWITTER CARD ===== -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SaSholom AI — умный помощник с персонажами">
  <meta name="twitter:description" content="100+ AI‑персонажей, фото‑благословения, голосовой ввод.">
  <meta name="twitter:image" content="https://sasholomsite.vercel.app/preview.png">

  <!-- ===== ТЕМА И PWA ===== -->
  <meta name="theme-color" content="#060b12">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- ===== ШРИФТЫ ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">

  <!-- ===== БИБЛИОТЕКИ (CDN) ===== -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- ?v=N — при изменении файла увеличь версию, чтобы сбросить кэш браузеров -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <!-- ============================================================
       ШАПКА: логотип, выбор персонажа, язык, тема, меню
       ============================================================ -->
  <header class="topbar">
    <h1 class="brand" data-i18n="title">🚀 SaSholom</h1>

    <div class="topbar-right">
      <!-- Выбор персонажа (опции наполняет script.js) -->
      <select id="character-select" class="select"></select>

      <button id="lang-toggle" class="chip" data-i18n-title="langTitle">🌐 RU</button>
      <button id="theme-toggle" class="chip" data-i18n-title="themeTitle">🌓</button>

      <!-- Меню со всеми настройками -->
      <details class="menu">
        <summary class="chip"><i data-lucide="sliders-horizontal"></i></summary>
        <div class="menu-panel">

          <div class="menu-section">
            <div class="menu-label" data-i18n="menuModel">Модель</div>
            <div class="menu-row">
              <button class="provider-btn active" data-provider="chadgpt"><i data-lucide="cpu"></i> GPT</button>
              <button class="provider-btn" data-provider="gemini"><i data-lucide="sparkles"></i> Gemini</button>
            </div>
          </div>

          <div class="menu-section">
            <div class="menu-label" data-i18n="menuCategory">Категория персонажей</div>
            <div class="menu-row">
              <select id="category-select" class="select"></select>
              <button class="preset-btn active" id="default-char-btn" data-i18n="defaultMode">💬 Обычный</button>
            </div>
          </div>

          <div class="menu-section">
            <div class="menu-label" data-i18n="voiceLangTitle">Язык распознавания речи</div>
            <div class="menu-row">
              <button id="lang-btn" class="preset-btn">🇷🇺 RU</button>
            </div>
          </div>

          <div class="menu-section">
            <div class="menu-label" data-i18n="menuChat">Чат и данные</div>
            <input type="text" id="search-input" class="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Поиск...">
            <div class="menu-row">
              <button id="export-btn" class="tool-btn"><i data-lucide="download"></i> <span data-i18n="exportBtn">Экспорт</span></button>
              <button id="notes-btn" class="tool-btn"><i data-lucide="notepad-text"></i> <span data-i18n="notesBtn">Заметки</span></button>
              <button id="clear-chat-btn" class="tool-btn danger"><span data-i18n="clearBtn">🗑️ Очистить</span></button>
            </div>

            <!-- Панель заметок (имя, предпочтения) -->
            <div id="notes-panel" class="notes-panel" style="display:none">
              <label><span data-i18n="notesName">Имя:</span> <input type="text" id="note-name"></label>
              <label><span data-i18n="notesPrefs">Предпочтения:</span> <textarea id="note-prefs" rows="2"></textarea></label>
              <button id="save-notes-btn" data-i18n="notesSave">Сохранить</button>
            </div>

            <div class="menu-foot"><span id="counter" class="counter">0</span></div>
          </div>

        </div>
      </details>
    </div>
  </header>

  <!-- ============================================================
       ЧАТ (сообщения добавляет script.js)
       ============================================================ -->
  <main class="chat-area">
    <div id="chat-history"></div>
  </main>

  <!-- ============================================================
       КОМПОЗЕР: поле ввода с инструментами
       ============================================================ -->
  <div class="composer">

    <!-- Превью прикреплённого фото -->
    <div id="image-preview" class="image-preview" style="display:none">
      <img id="preview-img" src="" alt="Превью">
      <button id="remove-preview" class="remove-preview"><i data-lucide="x"></i></button>
    </div>

    <div class="composer-box">
      <textarea id="ai-question" rows="1" data-i18n-placeholder="placeholder" placeholder="Задай любой вопрос..." maxlength="2000"></textarea>
      <div class="composer-actions">
        <div class="composer-group">
          <input type="file" id="image-input" accept="image/*" style="display:none">
          <button id="image-btn" class="cbtn" data-i18n-title="imageTitle"><i data-lucide="image"></i></button>
          <button id="camera-btn" class="cbtn" data-i18n-title="cameraTitle"><i data-lucide="camera"></i></button>
          <input type="file" id="file-input" accept=".txt,.pdf" style="display:none">
          <button id="file-btn" class="cbtn" data-i18n-title="fileTitle"><i data-lucide="paperclip"></i></button>
        </div>
        <div class="composer-group">
          <button id="voice-btn" class="cbtn" data-i18n-title="voiceTitle"><i data-lucide="mic"></i></button>
          <button id="ai-ask-btn" class="send-btn" data-i18n-title="askBtn"><i data-lucide="arrow-up"></i></button>
        </div>
      </div>
    </div>

    <footer class="credit">Made with <span>💚</span> by S.K.</footer>
  </div>

  <!-- ===== ОСНОВНОЙ СКРИПТ ===== -->
  <!-- Обычный скрипт (не module): работает и при открытии файла
       двойным кликом (file://), и на сервере/Vercel. -->
  <script src="script.js?v=2"></script>

  <!-- ===== SERVICE WORKER (PWA) ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
